<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시글 삭제</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; text-align: center; }
        .delete-container { max-width: 500px; margin: 0 auto; border: 1px solid #ddd; padding: 30px; border-radius: 8px; }
        .btn { padding: 8px 15px; text-decoration: none; border-radius: 4px; font-size: 14px; display: inline-block; border: none; cursor: pointer; }
        .btn-danger { background-color: #dc3545; color: white; }
        .btn-secondary { background-color: #6c757d; color: white; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="delete-container">
        <h2>정말 삭제하시겠습니까?</h2>
        <p><strong>"{{ post.title }}"</strong> 게시글은 영구적으로 삭제됩니다.</p>
        
        <form method="post" style="margin-top: 20px;">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">삭제하기</button>
            <a href="{% url 'board:post_detail' post.pk %}" class="btn btn-secondary">취소</a>
        </form>
    </div>
</body>
</html>
