<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f8f9fa; }
        .signup-container { width: 350px; padding: 30px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 20px; }
        .signup-container p { margin-bottom: 15px; }
        .signup-container label { display: block; margin-bottom: 5px; font-weight: bold; }
        .signup-container input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-submit:hover { background-color: #218838; }
        .back-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .back-link a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2>회원가입</h2>
        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
                <div style="background-color: #f8d7da; color: #721c24; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px;">
                    입력한 정보에 오류가 있습니다. 다시 확인해 주세요!
        </div>
            {% endif %}
            
            {{ form.as_p }}
            <button type="submit" class="btn-submit">가입하기</button>
        </form>
        <div class="back-link">
            이미 계정이 있으신가요? <a href="{% url 'accounts:login' %}">로그인하기</a>
        </div>
    </div>
</body>
</html>
