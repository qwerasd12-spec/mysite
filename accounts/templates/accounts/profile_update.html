<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원정보 수정</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8f9fa; }
        .container { width: 420px; padding: 30px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        form p { margin-bottom: 15px; font-size: 14px; color: #555; }
        form p label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        form p input, form p textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .btn-submit { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 15px; margin-top: 10px; }
        .btn-submit:hover { background-color: #0056b3; }
        .back-link { text-align: center; margin-top: 15px; font-size: 14px; }
        .back-link a { color: #6c757d; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>회원정보 수정</h2>
        <form method="post">
            {% csrf_token %}
            <!--유효성 검사-->
            {%if user_form.errors or profile_form.errors %}
                <div style="background-color: #f8d7da; color: #721c24; padding: 10x; border-radius: 4px; margin-bottom: 15px; font-size: 14px; ">
                    입력한 정보에 오류가 있습니다. 다시 확인해주세요!
                </div>
            {% endif %}
            
            
            
            {{ user_form.as_p }}
            <hr style="border: 0; border-top: 1px solid #dee2e6; margin: 20px 0;">
            {{ profile_form.as_p }}
            
            <button type="submit" class="btn-submit">저장하기</button>
        </form>
        
        <div class="back-link">
            <a href="{% url 'accounts:profile' %}">취소하고 돌아가기</a>
        </div>
    </div>
</body>
</html>
