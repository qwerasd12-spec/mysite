<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>   
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f8f9fa; }
        .login-container { width: 320px; padding: 30px; background: white; border: 1px solid #ddd; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 20px; }
        .login-container p { margin-bottom: 15px; }
        .login-container label { display: block; margin-bottom: 5px; font-weight: bold; }
        .login-container input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-submit { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-submit:hover { background-color: #0056b3; }
        .signup-link { text-align: center; margin-top: 20px; font-size: 14px; }
        .signup-link a { color: #007bff; text-decoration: none; }
        .signup-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
    <h2>로그인</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">로그인하기</button>
    </form>
    <div class="signup-link">
        계정이 없으신가요? <a href="{% url 'accounts:signup' %}">회원가입하기</a>
    </div>
</body>
</html>
